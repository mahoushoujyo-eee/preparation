apiVersion: apps/v1
kind: Deployment
metadata:
  name: w2-deploy
  labels:
    app: w2app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: w2app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: w2app
    spec:
      containers:
        - name: w2app
          image: w2-app:1.1
          ports:
            - containerPort: 8085
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /live
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/w2/
              readOnly: true
          env:
            - name: CONFIG_PATH
              value: /etc/w2/config.yaml
      volumes:
        - name: config
          configMap:
            name: w2app-config
